version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: EWS_PostgreSQL
    environment:
      POSTGRES_DB: flood_ews
      POSTGRES_USER: ews_user
      POSTGRES_PASSWORD: ews_password_secure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews_user -d flood_ews"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: EWS_Redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: EWS_MQTT_Broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: EWS_ML_Service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: EWS_Ingestion_Service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ML_SERVICE_URL=http://ml-service:8000
      - GATEWAY_URL=http://backend-gateway:5000
    depends_on:
      - mosquitto
      - ml-service

  backend-gateway:
    build:
      context: ./backend-gateway
      dockerfile: Dockerfile
    container_name: EWS_Backend_Gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=ews_jwt_super_secret_key_2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: EWS_Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-gateway

volumes:
  pgdata:
